apiVersion: apps/v1
kind: Deployment
metadata:
  name: suqya-worker
  namespace: suqya
  labels:
    app: suqya-worker
    app.kubernetes.io/name: suqya-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: suqya-worker
  template:
    metadata:
      labels:
        app: suqya-worker
        app.kubernetes.io/name: suqya-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: suqya-worker
      containers:
        - name: worker
          image: ACCOUNT_ID.dkr.ecr.me-south-1.amazonaws.com/suqya/api:latest
          command: ["node", "dist/worker.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: DATABASE_URL
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: JWT_SECRET
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: S3_BUCKET
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "process.exit(0)"
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: suqya-worker
  namespace: suqya
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/suqya-staging-worker
