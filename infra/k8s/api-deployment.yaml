apiVersion: apps/v1
kind: Deployment
metadata:
  name: suqya-api
  namespace: suqya
  labels:
    app: suqya-api
    app.kubernetes.io/name: suqya-api
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: suqya-api
  template:
    metadata:
      labels:
        app: suqya-api
        app.kubernetes.io/name: suqya-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: suqya-api
      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.me-south-1.amazonaws.com/suqya/api:latest
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: DATABASE_URL
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: JWT_SECRET
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: S3_BUCKET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /v1/tenants/public
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/tenants/public
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: suqya-api
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: suqya-api
  namespace: suqya
  labels:
    app: suqya-api
spec:
  selector:
    app: suqya-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: suqya-api
  namespace: suqya
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/suqya-staging-api
