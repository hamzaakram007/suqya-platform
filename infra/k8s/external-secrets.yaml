apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: suqya
spec:
  provider:
    aws:
      service: SecretsManager
      region: me-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: suqya-secrets
  namespace: suqya
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: suqya-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: suqya-staging/app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: suqya
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/suqya-staging-external-secrets
