apiVersion: batch/v1
kind: Job
metadata:
  name: suqya-migrate
  namespace: suqya
  labels:
    app.kubernetes.io/name: suqya-migrate
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: suqya-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: suqya-api
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z $(echo $DATABASE_URL | sed 's/.*@//' | cut -d: -f1) 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: DATABASE_URL
      containers:
        - name: migrate
          image: ACCOUNT_ID.dkr.ecr.me-south-1.amazonaws.com/suqya/api:latest
          command:
            - sh
            - -c
            - |
              npx prisma migrate deploy --schema=prisma/schema.prisma
              npx prisma db execute --stdin --schema=prisma/schema.prisma <<'SQL'
              CREATE EXTENSION IF NOT EXISTS postgis;
              SQL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: suqya-secrets
                  key: DATABASE_URL
