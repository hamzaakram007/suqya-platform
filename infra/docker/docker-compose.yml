services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: suqya
      POSTGRES_PASSWORD: suqya_dev
      POSTGRES_DB: suqya
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
